name: GPU Simulator

# Optional, non-required check. The hosted runners have no GPU, so this builds
# the test executable with Meson and hipcc as usual (gfx1030, the architecture
# set in meson.build) and runs it on a simulated AMD Radeon RX 6900 XT
# (https://github.com/pantheongpu/pantheonsim), so the GPU tests run instead of
# being skipped. A simulator cannot reproduce hardware-specific behavior or
# timing, so it complements real-GPU testing and does not replace it.

on:
  workflow_dispatch:
  push:
    branches: [ verify-gpu-sim ]
  pull_request:
    branches: [ master ]
    paths:
      - "src/**"
      - "include/**"
      - "tests/**"
      - "bench/**"
      - "vendor/**"
      - "native/**"
      - "meson.build"
      - ".github/workflows/gpu-sim.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gpu-tests:
    name: tests (ROCm 7.1 and simulated RX 6900 XT)
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      # Installs hipcc under /opt/rocm (where native/hip.ini expects it) and
      # the simulated GPU.
      - name: Set up the simulated GPU and ROCm
        uses: pantheongpu/setup-pantheonsim@ca87fe3143b29166822b923d6050945c5179408c # v0.1.5
        with:
          gpu: amd/rx6900xt
          cuda-toolkit: none
          rocm: "7.1"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libgtest-dev pkg-config

      - name: Configure
        run: meson setup build --native-file native/hip.ini

      - name: Build
        run: ninja -C build -j3 hip-img-fx-tests

      # The executable is run directly (as in tests/README.md) so the full
      # GoogleTest log is kept.
      - name: Run the tests on the simulated GPU
        run: |
          set -o pipefail
          vgpu run ./build/hip-img-fx-tests 2>&1 | tee tests.log

      # Without a device the GPU tests are skipped and the run still passes, so
      # a missing device or any unexpected skip fails the job here. Four
      # OrchestratorSpec tests call GTEST_SKIP() unconditionally in the sources
      # and are the only skips allowed.
      - name: Check that a GPU was found and no GPU test was skipped
        run: |
          grep -F '=== GPU detected:' tests.log
          if grep -E '^\[  SKIPPED \] [A-Za-z0-9_/]+\.[A-Za-z0-9_/]+ \(' tests.log \
              | grep -v -E 'OrchestratorSpec\.GetOrTune(Invalidates|Handles)[A-Za-z]*Invalid'; then
            echo "::error::tests were skipped"
            exit 1
          fi
